# 欢乐斗地主复刻 · Nginx 反向代理片段
#
# 用法：把下面两个 location 块并入站点 server {} 中。
# 假设前端构建产物位于 /www/wwwroot/ddz，后端监听 127.0.0.1:9104。

# 前端静态资源
location /ddz/ {
    alias /www/wwwroot/ddz/;
    index index.html;
    # 未匹配到文件时回落到单页入口
    try_files $uri $uri/ /ddz/index.html;

    # manifest.json、index.html 不缓存，避免发版后仍取到旧入口
    location ~* /ddz/(index\.html|manifest\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 带 hash 的静态资源可长缓存
    location ~* /ddz/(assets|static)/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# 牌局 WebSocket 反向代理
location /ddz-ws/ {
    proxy_pass http://127.0.0.1:9104/;
    proxy_http_version 1.1;

    # WebSocket 握手
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # 牌局连接可能长时间空闲，避免被网关提前断开
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

# 说明
# 1. 前端 uni-app 的 manifest.json 中 h5.router.base 必须与上面的路径前缀一致（/ddz/），
#    否则构建产物里的资源引用会指向错误路径，表现为白屏或 assets 404。
# 2. 前端 ddz-net.js 的 WS_URL 应写 wss://<域名>/ddz-ws/，经此反代转发到后端 9104。
# 3. 后端为 NDJSON 协议（每帧 JSON 以换行结尾），proxy_buffering 必须关闭，
#    否则消息会被 Nginx 缓冲合并，客户端无法及时收到状态更新。
